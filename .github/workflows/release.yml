# Publishes index.html and recover.py as a release, with a SHA256SUMS file and
# a signed build-provenance attestation for each, so a copy of the tool can be
# checked against something other than the word of whoever handed it over.
#
# Run it by pushing a tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# There is no build step: index.html and recover.py ship exactly as committed.
# The attestation binds those bytes to this repository, this workflow and the
# commit the tag points at.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload its files
      id-token: write      # sign the attestation with a short-lived certificate
      attestations: write  # store the attestation against this repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Never publish a recover.py that fails its own known-answer tests.
      - name: Run the recover.py self-test
        run: python3 recover.py --selftest

      - name: Write the checksums
        run: sha256sum index.html recover.py | tee SHA256SUMS

      - name: Attest index.html and recover.py
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            index.html
            recover.py

      # The gh CLI on the runner rather than a marketplace action: one less
      # third-party action in the chain. The tag comes in through the
      # environment, never interpolated into the script.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "back-stop ${TAG}. Use these files, not a copy from anywhere else."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "Check a download before you put real codes in it:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify index.html --repo ${REPO}"
            echo '```'
          } > notes.md
          gh release create "${TAG}" index.html recover.py SHA256SUMS \
            --repo "${REPO}" --title "${TAG}" --notes-file notes.md --verify-tag
